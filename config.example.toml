# Jarvis — indstillinger
# Kopiér til config.toml og ret til. Jarvis kopierer selv filen første gang,
# hvis config.toml ikke findes.

[hotkey]
# Hold tasterne nede, mens du taler. Slip for at sende.
push_to_talk = "ctrl+alt+j"

[audio]
sample_rate = 16000
# Optagelser kortere end dette ignoreres (utilsigtede tryk).
min_seconds = 0.4
# Tom = systemets standardmikrofon. Ellers navn eller nummer på enheden.
input_device = ""

[stt]
# faster-whisper-model. Muligheder bl.a.: "small", "medium", "large-v3",
# "large-v3-turbo". Større = bedre dansk, men langsommere.
model = "large-v3-turbo"
language = "da"
# "auto" bruger grafikkortet (CUDA), hvis det findes, ellers processoren.
device = "auto"
# "auto" = int8 på processor, float16 på grafikkort.
compute_type = "auto"
beam_size = 5

[brain]
model = "claude-opus-5-5"
# low | medium | high | xhigh | max. Lavere = hurtigere svar.
effort = "medium"
max_tokens = 16000
# Loft over hvor mange værktøjsrunder ét spørgsmål må bruge.
max_tool_rounds = 15

[tts]
# "local" (Windows' indbyggede stemmer, ingen konto) eller "elevenlabs".
engine = "local"

[tts.local]
# Del af stemmens navn eller sprogkode. Kræver at en dansk stemme er
# installeret i Windows (Indstillinger > Tid og sprog > Tale).
voice = "da"
rate = 185

[tts.elevenlabs]
voice_id = ""
model_id = "eleven_multilingual_v2"

[files]
# Filværktøjerne må KUN arbejde i disse mapper (og deres undermapper).
# Alt andet afvises. Brug enkelte anførselstegn, så \ ikke skal dobbeltes.
allowed_dirs = [
    'C:\Users\nicolaj\Documents\Jarvis',
]
# Største fil, Jarvis læser eller søger i (i kilobyte).
max_file_kb = 512

[programs]
# Programmer Jarvis må åbne, efter navn. Andre programmer kan ikke startes.
notesblok = "notepad.exe"
lommeregner = "calc.exe"
stifinder = "explorer.exe"

[memory]
database = "data/jarvis.db"

[log]
file = "logs/jarvis.log"
